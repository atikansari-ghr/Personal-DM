name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: personaldocs
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: personaldocs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U personaldocs" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PD_DB_HOST: 127.0.0.1
      PD_DB_USER: personaldocs
      PD_DB_PASSWORD: ci-only-password
      PD_OCRMYPDF_CMD: ocrmypdf
    steps:
      - uses: actions/checkout@v4
      - name: System packages (OCR, LibreOffice, PostgreSQL client)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-osd tesseract-ocr-ara tesseract-ocr-hin fonts-noto-core ocrmypdf ghostscript qpdf poppler-utils \
            libreoffice-writer libreoffice-calc libreoffice-impress fonts-dejavu-core postgresql-client shellcheck
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r backend/requirements-dev.txt
      - name: Verify
        run: PY=.venv/bin/python scripts/verify.sh
      - name: One-line installer lifecycle (stubbed)
        run: sudo bash tests/installer/test_personal_dm.sh
      - name: Package frontend build
        if: startsWith(github.ref, 'refs/tags/v')
        run: tar -czf frontend-dist.tar.gz -C frontend dist
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: frontend-dist
          path: frontend-dist.tar.gz

  e2e:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: personaldocs
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: personaldocs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U personaldocs" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PD_DB_HOST: 127.0.0.1
      PD_DB_USER: personaldocs
      PD_DB_PASSWORD: ci-only-password
      PD_OCRMYPDF_CMD: ocrmypdf
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-osd tesseract-ocr-ara tesseract-ocr-hin fonts-noto-core ocrmypdf ghostscript qpdf poppler-utils fonts-dejavu-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m venv .venv && .venv/bin/pip install -q -r backend/requirements-dev.txt
          (cd frontend && npm ci && npm run build)
          (cd tests/e2e && npm ci && npx playwright install --with-deps chromium)
      - name: Browser flow, accessibility audit and desktop/tablet/phone parity
        run: scripts/e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: |
            docs/screenshots/
            docs/images/screenshots/
            docs/a11y-report.json
            docs/layout-report.json
            tests/e2e/out/layout/
            docs/parity-report.json

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
      - name: Attach prebuilt frontend to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md"
          gh release upload "$GITHUB_REF_NAME" frontend-dist.tar.gz --clobber --repo "$GITHUB_REPOSITORY"
