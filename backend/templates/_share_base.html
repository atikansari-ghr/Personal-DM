<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>{{ app }}</title>
<style>
:root{--bg:#f5f8f5;--card:#fff;--ink:#14281d;--muted:#5b6b61;--brand:#1f5135;--line:#dfe7e1}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:560px;margin:8vh auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px}
h1{font-size:1.4rem;margin:0 0 6px}p{color:var(--muted)}
.btn{display:inline-block;background:var(--brand);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-size:1rem;text-decoration:none;cursor:pointer}
.btn.secondary{background:#fff;color:var(--brand);border:1px solid var(--line)}
input{width:100%;box-sizing:border-box;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:1rem;margin:8px 0 14px}
.err{color:#9b1c1c}.small{font-size:.85rem}
</style></head><body><main><div class="card">{% block body %}{% endblock %}</div>
<p class="small">Shared through {{ app }}. Downloaded copies are independent of this link's expiry.</p></main></body></html>
