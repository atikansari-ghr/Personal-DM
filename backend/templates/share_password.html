{% extends "_share_base.html" %}{% block body %}<h1>Password required</h1><p>Enter the password you were given to open this document.</p>
{% if error %}<p class="err" role="alert">{{ error }}</p>{% endif %}
<form method="post"><input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf }}">
<label for="pw">Password</label><input id="pw" name="password" type="password" autocomplete="off" required autofocus>
<button class="btn" type="submit">Open</button></form>{% endblock %}
